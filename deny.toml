# cargo-deny supply-chain policy for eos-store.
# Copied from the E-OS meta-repo (deny.toml, sha256
# 4b1de40a64fc4327011e265c3503afd34d007458c41bff633528e66a5baa0995) and adjusted
# in exactly five places — each marked "E-OS product adjustment".
# Run: cargo deny check

[advisories]
version = 2
yanked = "deny"
# E-OS product adjustment 1: three "unmaintained" advisories that arrive with
# the Slint dependency tree and have no safe upgrade. Every one was read before
# it was listed; none is a vulnerability, and none is reachable from code this
# repository owns. Measured 2026-09-03 with cargo-deny 0.20.2 on slint 1.17.1.
# Remove an entry the moment Slint drops the dependency — this list is a debt
# register, not a mute button, and a NEW advisory still fails the gate.
ignore = [
    # paste 1.0.15 <- pulp <- (slint's numeric stack). Author archived the repo.
    { id = "RUSTSEC-2024-0436", reason = "transitive via slint; upstream archived, no safe upgrade; not a vulnerability" },
    # rustybuzz 0.20.1 <- usvg <- resvg <- i-slint-common. Maintainer stepped back.
    { id = "RUSTSEC-2026-0206", reason = "transitive via slint (resvg); harfrust migration is Slint's call, not ours" },
    # ttf-parser <- the same resvg/usvg chain.
    { id = "RUSTSEC-2026-0192", reason = "transitive via slint (resvg); no safe upgrade published" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # E-OS product adjustment 2: this crate and eos-ui are AGPL-3.0-or-later.
    "AGPL-3.0-or-later",
    # E-OS product adjustment 3: the Slint crates are
    # "GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR LicenseRef-Slint-Software-3.0".
    # E-OS takes the GPL-3.0-only arm — compatible with AGPL-3.0-or-later
    # (GPLv3 §13) and the only arm that is a real open-source licence.
    "GPL-3.0-only",
]

# E-OS product adjustment 4: one crate, one licence, one reason. libfuzzer-sys
# is "(MIT OR Apache-2.0) AND NCSA" and reaches the graph only as a *build*
# dependency of the Slint compiler (image -> ravif -> rav1e -> libfuzzer-sys);
# nothing of it is linked into the product binary. Narrower than allowing NCSA
# for every crate in the tree.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# E-OS product adjustment 5: the shared UI backend is a pinned git dependency.
# GitLab is the source of truth (ADR-0001); the GitHub mirror is listed because
# build recipes fetch from it. Any *other* git source stays denied.
allow-git = [
    "https://gitlab.com/e-os/eos-ui.git",
    "https://github.com/Gh0s777tt/eos-ui.git",
]
